server:
  port: 8080
spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customers
              uri: lb://customer-service
              predicates:
                - Path=/api/customers,/api/customers/**
            - id: bank-accounts
              uri: lb://ebank-service
              predicates:
                - Path=/api/accounts,/api/accounts/**
            - id: chatbot
              uri: lb://chatbot-service
              predicates:
                - Path=/api/chat,/api/chat/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
