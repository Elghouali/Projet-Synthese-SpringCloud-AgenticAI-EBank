server:
  port: 8083
spring:
  application:
    name: chatbot-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
    mcp:
      client:
        enabled: true
        type: SYNC
        name: ebank-chatbot
        request-timeout: 20s
        streamable-http:
          connections:
            customers:
              url: ${CUSTOMER_MCP_URL:http://localhost:8081}
              endpoint: /mcp
            accounts:
              url: ${EBANK_MCP_URL:http://localhost:8082}
              endpoint: /mcp
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
